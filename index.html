<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مخبز الكب كيك: العمليات على الأعداد الصحيحة</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ffe3ef; --bg2:#fff4e0; --pink:#ff7eb6; --deep:#c2185b; --lav:#8e5bd0; --card:#ffffff; --ink:#4a1e3a; --butter:#ffe08a; --ok:#35a876; --bad:#e2547a; --line:#f4a7cb;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg1:#3a1530; --bg2:#2b1a3d; --card:#fff0f7; }
}
:root[data-theme="dark"]{ --bg1:#3a1530; --bg2:#2b1a3d; --card:#fff0f7; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,rgba(255,255,255,.55) 0 8%,transparent 9%),radial-gradient(circle at 88% 22%,rgba(255,255,255,.45) 0 6%,transparent 7%),linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--ink);font-family:"Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif;line-height:1.6}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block}
main{max-width:620px;margin:0 auto;padding:18px 16px 40px}
header{text-align:center}
h1{font-family:"Aref Ruqaa","Tajawal",serif;font-size:clamp(2.2rem,8vw,3.2rem);margin:6px 0 2px;color:var(--deep);line-height:1.3}
.sub{margin:0;font-weight:700;color:var(--lav)}
.who{display:inline-block;margin-top:10px;padding:6px 18px;background:var(--card);border:2px solid var(--pink);border-radius:999px;font-weight:800;color:var(--deep)}
.who span{margin-inline-start:10px;font-weight:700;color:var(--lav)}
.top{display:flex;justify-content:space-between;gap:10px;margin:16px 0 6px;font-weight:800}
.tag{background:var(--card);border:2px solid var(--line);color:var(--deep);padding:4px 16px;border-radius:999px}
.plate{display:flex;justify-content:center;padding:6px 0 0}
.plate svg{width:210px;height:auto;overflow:visible}
.lay{opacity:0;transform:translateY(-26px);transition:opacity .5s,transform .6s cubic-bezier(.3,1.5,.5,1)}
.lay.on{opacity:1;transform:none}
.wob{animation:wob .45s}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.dish{height:14px;width:250px;max-width:70%;margin:-4px auto 18px;border-radius:50%;background:var(--card);border:3px solid var(--line)}
.panel{background:var(--card);border:3px solid var(--pink);border-radius:26px;padding:20px 16px;box-shadow:0 10px 0 var(--line)}
.stage{margin:0;font-weight:800;color:var(--lav);text-align:center}
.q{font-size:1.9rem;font-weight:800;text-align:center;margin:6px 0 14px;color:var(--deep)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt,.go{font:inherit;font-weight:800;font-size:1.4rem;cursor:pointer;padding:12px;border-radius:999px;border:3px solid var(--pink);background:#fff;color:var(--deep);transition:transform .12s,background .2s}
.opt:hover:not(:disabled),.go:hover{transform:scale(1.04);background:#ffeaf4}
.opt:focus-visible,.go:focus-visible{outline:3px solid var(--lav);outline-offset:3px}
.opt.good{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff;opacity:.8}
.msg{min-height:3.2em;margin:14px 0 0;text-align:center;font-weight:700}
.win{text-align:center}
.win h2{font-family:"Aref Ruqaa","Tajawal",serif;font-size:2rem;margin:0 0 4px;color:var(--deep)}
.score{font-size:1.3rem;font-weight:800;color:var(--lav)}
.go{background:var(--pink);color:#fff;margin-top:6px;padding:10px 26px;font-size:1.1rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <h1>مخبز الكب كيك 🧁</h1>
    <p class="sub">زيّني الكب كيك بحل مسائل الأعداد الصحيحة</p>
    <div class="who">إعداد: داليا خالد بن بكر<span>الصف: أولى ثاني</span></div>
  </header>

  <div class="top"><span class="tag" id="prog"></span><span class="tag">⭐ <span class="m" id="score">0</span></span></div>

  <div class="plate">
    <svg id="cup" viewBox="0 0 200 220" aria-label="كب كيك يكتمل مع كل إجابة صحيحة">
      <g class="lay" id="L2"><path d="M40 125Q34 92 66 88Q100 80 134 88Q166 92 160 125Z" fill="#f4c48c" stroke="#b9774a" stroke-width="3" stroke-linejoin="round"/></g>
      <g class="lay" id="L1"><path d="M44 120L156 120L142 205Q100 214 58 205Z" fill="#ff7eb6" stroke="#c2185b" stroke-width="3" stroke-linejoin="round"/><g stroke="#fff" stroke-width="4" opacity=".55" stroke-linecap="round"><path d="M68 126L73 205"/><path d="M92 126L93 210"/><path d="M116 126L115 210"/><path d="M140 126L133 205"/></g></g>
      <g class="lay" id="L3" stroke="#c2185b" stroke-width="3" stroke-linejoin="round"><ellipse cx="100" cy="94" rx="64" ry="20" fill="#ffc2dd"/><ellipse cx="100" cy="72" rx="50" ry="17" fill="#ff9ac6"/><ellipse cx="100" cy="52" rx="34" ry="14" fill="#ffc2dd"/><path d="M100 30Q85 40 90 50Q100 44 110 50Q115 40 100 30Z" fill="#ff9ac6"/></g>
      <g class="lay" id="L4"><rect x="62" y="90" width="12" height="5" rx="2.5" fill="#8e5bd0" transform="rotate(30 68 92)"/><rect x="92" y="98" width="12" height="5" rx="2.5" fill="#ffd166" transform="rotate(-20 98 100)"/><rect x="120" y="90" width="12" height="5" rx="2.5" fill="#35a8d8" transform="rotate(50 126 92)"/><rect x="80" y="70" width="12" height="5" rx="2.5" fill="#ffd166" transform="rotate(-40 86 72)"/><rect x="108" y="74" width="12" height="5" rx="2.5" fill="#8e5bd0" transform="rotate(15 114 76)"/><rect x="92" y="50" width="11" height="5" rx="2.5" fill="#35a8d8" transform="rotate(35 97 52)"/><rect x="74" y="104" width="12" height="5" rx="2.5" fill="#35a876" transform="rotate(10 80 106)"/><rect x="114" y="102" width="12" height="5" rx="2.5" fill="#ffd166" transform="rotate(-35 120 104)"/></g>
      <g class="lay" id="L5"><path d="M100 22Q104 10 118 8" stroke="#4a2c17" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="100" cy="28" r="11" fill="#e8203f" stroke="#7a0f20" stroke-width="3"/><circle cx="96" cy="24" r="3" fill="#fff" opacity=".85"/></g>
      <g class="lay" id="L6"><text x="12" y="52" font-size="26">✨</text><text x="160" y="40" font-size="22">✨</text><text x="150" y="150" font-size="20">✨</text></g>
    </svg>
  </div>
  <div class="dish"></div>

  <section class="panel" id="panel"></section>
</main>

<script>
var M = "\u2212";
var Q = [
  {q: "(" + M + "8) + 5 = ؟", o: ["3", M+"3", M+"13", "13"], a: 1, h: "الإشارتان مختلفتان: اطرحي 8 − 5، وخذي إشارة العدد الأكبر (السالب)."},
  {q: "(" + M + "3) " + M + " (" + M + "10) = ؟", o: [M+"7", M+"13", "7", "13"], a: 2, h: "الطرح يعني جمع العدد المعاكس، فالسؤال يصير (" + M + "3) + 10."},
  {q: "(" + M + "6) \u00d7 7 = ؟", o: [M+"1", "42", M+"42", "1"], a: 2, h: "إشارتان مختلفتان، فناتج الضرب سالب."},
  {q: "(" + M + "5) \u00d7 (" + M + "9) = ؟", o: ["45", M+"45", M+"14", "14"], a: 0, h: "إشارتان متشابهتان، فناتج الضرب موجب."},
  {q: "(" + M + "48) \u00f7 6 = ؟", o: [M+"42", "42", "8", M+"8"], a: 3, h: "إشارتان مختلفتان، فناتج القسمة سالب: 48 ÷ 6 = 8."}
];
var NAMES = ["كأس الكيك", "الكيكة", "الكريمة الوردية", "الرشّات الملونة", "الكرزة"];
var LAYER = [1, 2, 3, 4, 5];
var step, score, wrongNow, locked;
var $ = function(id){ return document.getElementById(id); };
function m(s){ return '<span class="m">' + s + '</span>'; }

function setup(){
  for(var i = 1; i <= 6; i++) $("L" + i).classList.remove("on");
  step = 0; score = 0; upd(); ask();
}
function upd(){
  $("prog").innerHTML = "الخطوة " + m(Math.min(step + 1, 5) + " / 5");
  $("score").textContent = score;
}
function ask(){
  wrongNow = false; locked = false;
  var q = Q[step];
  $("panel").innerHTML = '<p class="stage">أجيبي لتضيفي: ' + NAMES[step] + '</p>' +
    '<div class="q">' + m(q.q) + '</div><div class="opts" id="opts"></div>' +
    '<p class="msg" id="msg" aria-live="polite">اختاري الإجابة الصحيحة.</p>';
  q.o.forEach(function(t, k){
    var b = document.createElement("button");
    b.className = "opt"; b.innerHTML = m(t);
    b.onclick = function(){ pick(b, k); };
    $("opts").appendChild(b);
  });
}
function pick(btn, k){
  if(locked) return;
  var q = Q[step];
  if(k === q.a){
    locked = true;
    btn.classList.add("good");
    if(!wrongNow) score += 20;
    $("msg").textContent = wrongNow ? "صح! أضفنا " + NAMES[step] + "." : "رائع! من أول محاولة ⭐";
    var done = LAYER[step];
    step++;
    $("L" + done).classList.add("on");
    $("score").textContent = score;
    setTimeout(function(){
      if(step === Q.length) win(); else { upd(); ask(); }
    }, 1200);
  } else {
    wrongNow = true;
    btn.classList.add("bad"); btn.disabled = true;
    var c = $("cup"); c.classList.remove("wob"); void c.getBoundingClientRect(); c.classList.add("wob");
    $("msg").textContent = "قريبة! جربي مرة ثانية. تلميح: " + q.h;
  }
}
function win(){
  $("L6").classList.add("on");
  $("prog").innerHTML = "اكتمل الكب كيك " + m("5 / 5");
  var txt = score === 100 ? "علامة كاملة! كل الإجابات من أول محاولة." :
    score >= 60 ? "عمل جميل، وبقليل من التدريب تصلين إلى العلامة الكاملة." :
    "بداية حلوة، جربي مرة ثانية لتجمعي نجومًا أكثر.";
  $("panel").innerHTML = '<div class="win"><h2>كب كيك جاهز 🎉</h2>' +
    '<p>شكرًا لكم على اللعب! تم تزيين الكب كيك بالكامل.</p>' +
    '<p class="score">نجومك: ' + m(score + " / 100") + '</p><p>' + txt + '</p>' +
    '<button class="go" id="again">العبي مرة ثانية</button></div>';
  $("again").onclick = setup;
}
setup();
</script>
</body>
</html>
